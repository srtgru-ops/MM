<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>نظام مركز محترف</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
:root{--cyan:#42b4c9;--cyan2:#79d3df;--gray:#929398;--ink:#24333a;--muted:#77878d;--bg:#f4f8f9;--white:#fff;--line:#e5eef0;--shadow:0 20px 55px rgba(48,83,92,.10);--soft:0 8px 24px rgba(48,83,92,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'Tajawal',Tahoma,Arial,sans-serif;background:radial-gradient(circle at 88% 2%,rgba(66,180,201,.12),transparent 25%),var(--bg);color:var(--ink)}
body:before{content:'';position:fixed;left:-120px;bottom:-150px;width:360px;height:360px;border-radius:50%;background:rgba(66,180,201,.06);filter:blur(5px);pointer-events:none}
header{height:92px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(218,232,235,.8);display:flex;align-items:center;justify-content:space-between;padding:0 42px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:16px}.brand img{height:66px;width:112px;object-fit:contain;mix-blend-mode:multiply}.brand b{font-size:20px;font-weight:800}.brand small{display:block;color:var(--muted);margin-top:4px;font-size:13px}.menuBtn{border:1px solid #dceff2;background:linear-gradient(145deg,#fff,#eaf8fa);color:var(--cyan);font-size:25px;width:52px;height:52px;border-radius:16px;cursor:pointer;box-shadow:var(--soft);transition:.2s}.menuBtn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(66,180,201,.18)}
.sidebar{position:fixed;right:-370px;top:0;width:350px;height:100vh;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);z-index:50;box-shadow:-20px 0 70px rgba(31,55,62,.16);transition:.3s;padding:28px}.sidebar.open{right:0}.sideHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:18px;font-size:18px}.close{border:0;background:#f0f5f6;width:38px;height:38px;border-radius:11px;font-size:22px;cursor:pointer}.nav button{width:100%;text-align:right;border:0;background:transparent;padding:15px 14px;border-radius:13px;margin:5px 0;cursor:pointer;font-family:inherit;font-size:14px;color:#56666c;transition:.2s}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#edf9fb,#e3f5f8);color:#188ca1;font-weight:700;transform:translateX(-3px)}.overlay{display:none;position:fixed;inset:0;background:rgba(21,37,42,.34);backdrop-filter:blur(2px);z-index:40}.overlay.show{display:block}
main{max-width:1480px;margin:auto;padding:38px}.hero{position:relative;overflow:hidden;background:linear-gradient(125deg,#fff 0%,#f6fcfd 48%,#e5f7fa 100%);border:1px solid #d9edf1;border-radius:28px;padding:36px 38px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:20px}.hero:after{content:'M';position:absolute;left:35px;bottom:-55px;font-size:180px;font-weight:800;color:rgba(66,180,201,.055);line-height:1}.hero h1{margin:0 0 9px;font-size:30px;font-weight:800;letter-spacing:-.5px}.hero p{margin:0;color:var(--muted);font-size:15px}.pill{position:relative;z-index:1;background:rgba(255,255,255,.82);border:1px solid #d7edf1;padding:11px 17px;border-radius:999px;color:#168ca1;font-weight:700;box-shadow:0 7px 18px rgba(66,180,201,.09)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:24px 0}.card{position:relative;overflow:hidden;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:22px;padding:23px;box-shadow:var(--soft);transition:.22s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.card:before{content:'';position:absolute;top:0;right:0;width:5px;height:100%;background:#d9e3e6}.card.accent:before{background:linear-gradient(var(--cyan2),var(--cyan))}.card .label{color:#7b878e;font-size:13px;font-weight:500}.card .num{font-size:34px;font-weight:800;margin-top:10px;color:#2d3a40}.card.accent .num{color:var(--cyan)}
.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-top:22px}.panelHead{padding:21px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.panelHead h2{font-size:18px;margin:0;font-weight:800}.tools{display:flex;gap:9px;flex-wrap:wrap}.tools input,.tools select{font-family:inherit;border:1px solid #dce7e9;border-radius:12px;padding:11px 13px;background:#fdfefe;outline:none;transition:.2s}.tools input:focus,.tools select:focus{border-color:#8ed6e2;box-shadow:0 0 0 3px rgba(66,180,201,.09)}.refresh{border:0;background:linear-gradient(135deg,#55c0d2,#35a9be);color:#fff;border-radius:12px;padding:11px 17px;cursor:pointer;font-family:inherit;font-weight:700;box-shadow:0 8px 18px rgba(66,180,201,.22)}
.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:15px 18px;border-bottom:1px solid #edf2f3;text-align:right;white-space:nowrap}th{background:#f8fbfb;color:#66757c;font-size:13px;font-weight:700}td{font-size:14px}tbody tr{transition:.15s}tbody tr:hover{background:#f7fcfd}.empty{text-align:center!important;color:#929da2;padding:52px!important}.tag{display:inline-block;background:#e9f8fa;color:#168ca1;border:1px solid #d3eff3;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700}.view{display:none;animation:fade .3s ease}.view.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.formTitle{display:flex;align-items:center;gap:10px}.dot{width:11px;height:11px;background:var(--cyan);border-radius:50%;box-shadow:0 0 0 6px rgba(66,180,201,.11)}.notice{padding:14px 17px;background:#fffaf0;color:#826d22;border:1px solid #f0e3b6;border-radius:14px;margin:17px 0;font-size:13px}
@media(max-width:900px){header{padding:0 20px;height:82px}.cards{grid-template-columns:repeat(2,1fr)}main{padding:20px}.hero{align-items:flex-start;flex-direction:column;padding:28px}.brand b{font-size:16px}.hero h1{font-size:25px}}@media(max-width:520px){.cards{grid-template-columns:1fr}.brand small{display:none}.brand img{width:82px;height:55px}header{padding:0 14px}.sidebar{width:88%;right:-92%}.panelHead{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools input,.tools select{width:100%}.hero{border-radius:22px}.card{border-radius:18px}}
</style>
</head>
<body>
<header><div class="brand"><img src="assets/logo.jpeg" alt="شعار محترف"><div><b>نظام إدارة مركز محترف</b><small>لوحة متابعة التسجيل والبرامج</small></div></div><button class="menuBtn" onclick="toggleMenu()">☰</button></header>
<div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>
<aside class="sidebar" id="sidebar"><div class="sideHead"><strong>القائمة</strong><button class="close" onclick="toggleMenu(false)">×</button></div><div class="nav" id="nav"></div></aside>
<main>
<section id="home" class="view active">
<div class="hero"><div><h1>لوحة مركز محترف</h1><p>ملخص موحد لبيانات التسجيل القادمة من نماذج المركز.</p></div><div class="pill" id="lastUpdate">جاهز للربط</div></div>
<div class="cards"><div class="card accent"><div class="label">إجمالي المسجلين</div><div class="num" id="totalAll">0</div></div><div class="card"><div class="label">من منطقة الحدود الشمالية</div><div class="num" id="northCount">0</div></div><div class="card"><div class="label">من جامعة الحدود الشمالية</div><div class="num" id="northernUniCount">0</div></div><div class="card"><div class="label">من جامعة تبوك</div><div class="num" id="tabukUniCount">0</div></div></div>
<div class="panel"><div class="panelHead"><h2>ملخص النماذج</h2><button class="refresh" onclick="loadAll()">تحديث البيانات</button></div><div class="tableWrap"><table><thead><tr><th>النموذج</th><th>عدد المسجلين</th><th>آخر تحديث</th><th>الحالة</th></tr></thead><tbody id="summaryBody"></tbody></table></div></div>
</section>
<div id="formViews"></div>
</main>
<script>
// ضع رابط Web App لكل Google Sheet هنا بعد نشر Apps Script.
const FORMS = [
 {id:'ebdaa', name:'نموذج اختبارات مركز محترف – إبداع', api:''},
 {id:'form2', name:'النموذج الثاني', api:''},
 {id:'form3', name:'النموذج الثالث', api:''},
 {id:'form4', name:'النموذج الرابع', api:''}
];
let datasets={};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toggleMenu(force){let s=document.getElementById('sidebar'),o=document.getElementById('overlay');let open=force===undefined?!s.classList.contains('open'):force;s.classList.toggle('open',open);o.classList.toggle('show',open)}
function init(){const nav=document.getElementById('nav');nav.innerHTML=`<button class="active" onclick="showView('home',this)">⌂ الصفحة الرئيسية</button>`+FORMS.map(f=>`<button onclick="showView('${f.id}',this)">▦ ${esc(f.name)}</button>`).join('');
 document.getElementById('formViews').innerHTML=FORMS.map(f=>`<section id="${f.id}" class="view"><div class="hero"><div><div class="formTitle"><span class="dot"></span><h1>${esc(f.name)}</h1></div><p>بيانات المسجلين القادمة من Google Form / Google Sheet.</p></div><div class="pill" id="count-${f.id}">0 مسجل</div></div><div class="notice" id="notice-${f.id}">لم يتم ربط رابط Google Apps Script لهذا النموذج حتى الآن.</div><div class="panel"><div class="panelHead"><h2>المسجلون</h2><div class="tools"><input id="search-${f.id}" placeholder="بحث بالاسم أو الجوال أو الجهة" oninput="renderForm('${f.id}')"><select id="filter-${f.id}" onchange="renderForm('${f.id}')"><option value="">كل الجهات</option></select><button class="refresh" onclick="loadForm('${f.id}')">تحديث</button></div></div><div class="tableWrap"><table><thead id="head-${f.id}"></thead><tbody id="body-${f.id}"><tr><td class="empty">بانتظار ربط Google Sheet</td></tr></tbody></table></div></div></section>`).join('');loadAll();}
function showView(id,btn){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');toggleMenu(false);if(id!=='home')loadForm(id)}
async function loadForm(id){const f=FORMS.find(x=>x.id===id);if(!f.api){datasets[id]=[];renderForm(id);return []}try{const r=await fetch(f.api,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();datasets[id]=Array.isArray(j)?j:(j.data||[]);document.getElementById('notice-'+id).style.display='none';renderForm(id);return datasets[id]}catch(e){document.getElementById('notice-'+id).textContent='تعذر جلب البيانات: '+e.message;document.getElementById('notice-'+id).style.display='block';return []}}
function renderForm(id){let rows=datasets[id]||[];const search=(document.getElementById('search-'+id)?.value||'').trim().toLowerCase();const filter=document.getElementById('filter-'+id);const keys=rows.length?Object.keys(rows[0]):['الاسم','رقم الجوال','البريد الإلكتروني','الجهة','المنطقة','تاريخ التسجيل'];let agencyKey=keys.find(k=>/الجهة|الجامعة|جهة|جامعة/i.test(k));if(filter&&agencyKey){let old=filter.value, vals=[...new Set(rows.map(r=>r[agencyKey]).filter(Boolean))];filter.innerHTML='<option value="">كل الجهات</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');filter.value=old}let filtered=rows.filter(r=>(!search||Object.values(r).join(' ').toLowerCase().includes(search))&&(!filter?.value||String(r[agencyKey]||'')===filter.value));document.getElementById('count-'+id).textContent=rows.length+' مسجل';document.getElementById('head-'+id).innerHTML='<tr>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr>';document.getElementById('body-'+id).innerHTML=filtered.length?filtered.map(r=>'<tr>'+keys.map(k=>`<td>${esc(r[k])}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${keys.length}" class="empty">لا توجد بيانات مطابقة</td></tr>`}
function matchCount(rows,terms){return rows.filter(r=>{let s=Object.values(r).join(' ').toLowerCase();return terms.some(t=>s.includes(t))}).length}
async function loadAll(){await Promise.all(FORMS.map(f=>loadForm(f.id)));let all=Object.values(datasets).flat();document.getElementById('totalAll').textContent=all.length;document.getElementById('northCount').textContent=matchCount(all,['الحدود الشمالية','northern borders']);document.getElementById('northernUniCount').textContent=matchCount(all,['جامعة الحدود الشمالية','northern border university','northern borders university']);document.getElementById('tabukUniCount').textContent=matchCount(all,['جامعة تبوك','university of tabuk']);document.getElementById('lastUpdate').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});document.getElementById('summaryBody').innerHTML=FORMS.map(f=>`<tr><td>${esc(f.name)}</td><td>${(datasets[f.id]||[]).length}</td><td>${new Date().toLocaleDateString('ar-SA')}</td><td><span class="tag">${f.api?'مرتبط':'بانتظار الربط'}</span></td></tr>`).join('')}
init();
</script>
</body></html>
